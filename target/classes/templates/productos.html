<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Productos — BRUMA</title>
  <style>
    :root{--verde-oscuro:#26382E;--crema:#F5F1E9;--verde-claro:#BFD9C3;--cafe-oscuro:#2C1B0E;--marron:#4E342E;--crema-calida:#E8D5C4;--blanco-calido:#EDE5E1;--sombra:rgba(0,0,0,0.2);--linea-footer:rgba(255,255,255,0.1);}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:var(--crema);color:var(--cafe-oscuro);min-height:100vh;display:flex;flex-direction:column}
    nav{background:var(--verde-oscuro);border-bottom:3px solid var(--verde-claro);padding:0 2rem;display:flex;align-items:center;gap:1rem;height:68px;position:sticky;top:0;z-index:100;box-shadow:0 4px 16px var(--sombra)}
    .brand{font-size:1.4rem;font-weight:900;color:var(--crema);text-decoration:none;margin-right:auto;letter-spacing:3px;text-transform:uppercase}.brand span{color:var(--verde-claro)}
    nav a{color:var(--blanco-calido);text-decoration:none;padding:.45rem 1rem;border-radius:6px;font-size:.9rem;font-weight:500;transition:all .25s;border:1px solid transparent}
    nav a:hover,nav a.active{background:var(--verde-claro);color:var(--verde-oscuro);font-weight:700;border-color:var(--verde-claro)}
    .user-badge{display:flex;align-items:center;gap:.7rem;background:rgba(191,217,195,.12);border:1px solid rgba(191,217,195,.4);border-radius:20px;padding:.4rem 1rem;font-size:.85rem;color:var(--crema);margin-left:auto}
    .role-badge{display:inline-block;padding:.2rem .7rem;border-radius:12px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
    .role-badge.admin{background:rgba(78,52,46,.5);color:var(--crema-calida);border:1px solid var(--crema-calida)}
    .role-badge.cajero{background:rgba(191,217,195,.2);color:var(--verde-claro);border:1px solid var(--verde-claro)}
    .btn-logout{background:transparent;border:1px solid rgba(237,229,225,.4);color:var(--blanco-calido);padding:.4rem 1rem;border-radius:6px;font-size:.85rem;cursor:pointer;transition:all .25s}
    .btn-logout:hover{background:rgba(237,229,225,.15)}
    .container{max-width:1200px;margin:0 auto;padding:2.5rem 2rem;flex:1}
    .page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;padding-bottom:1rem;border-bottom:2px solid var(--verde-claro)}
    .page-hdr h1{font-size:1.8rem;color:var(--verde-oscuro);font-weight:800}
    .tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--crema-calida)}
    table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px var(--sombra)}
    thead tr{background:var(--verde-oscuro)}
    th{padding:.9rem 1.1rem;text-align:left;color:var(--crema);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
    td{padding:.9rem 1.1rem;color:var(--cafe-oscuro);font-size:.92rem;border-bottom:1px solid var(--blanco-calido)}
    tbody tr:last-child td{border-bottom:none}tbody tr:hover{background:rgba(191,217,195,.1)}
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;border-radius:7px;font-size:.85rem;font-weight:700;border:none;cursor:pointer;text-decoration:none;transition:all .25s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 4px 14px var(--sombra)}
    .btn-gold{background:var(--verde-oscuro);color:var(--crema);border:1px solid var(--verde-oscuro)}
    .btn-green{background:var(--verde-claro);color:var(--verde-oscuro);border:1px solid var(--verde-claro);font-weight:800}
    .btn-red{background:var(--marron);color:white;border:1px solid var(--marron)}
    .btn-blue{background:var(--blanco-calido);color:var(--verde-oscuro);border:1px solid var(--crema-calida)}
    .btn-sm{padding:.3rem .7rem;font-size:.75rem}
    .form-card{background:white;border:1px solid var(--crema-calida);border-radius:14px;padding:2rem;max-width:560px;box-shadow:0 4px 18px var(--sombra);margin-bottom:2rem}
    .form-card h3{color:var(--verde-oscuro);margin-bottom:1.4rem;font-size:1.1rem;font-weight:800}
    .fg{margin-bottom:1.2rem}.fg label{display:block;margin-bottom:.4rem;color:var(--marron);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
    .fg input,.fg select,.fg textarea{width:100%;padding:.75rem 1rem;background:var(--crema);border:1.5px solid var(--crema-calida);border-radius:8px;color:var(--cafe-oscuro);font-size:.93rem;outline:none;transition:all .25s}
    .fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--verde-claro);box-shadow:0 0 0 3px rgba(191,217,195,.25);background:white}
    .row{display:flex;gap:1rem;margin-top:1.4rem}
    /* FIX 5: badges de categoría con colores definidos directamente */
    .badge{display:inline-block;padding:.25rem .65rem;border-radius:10px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    .b-beb{background:rgba(38,56,46,.1);color:#26382E;border:1px solid #26382E}
    .b-com{background:rgba(191,217,195,.3);color:#2a6040;border:1px solid #BFD9C3}
    .b-pos{background:rgba(232,213,196,.5);color:#4E342E;border:1px solid #E8D5C4}
    .b-otr{background:#EDE5E1;color:#2C1B0E;border:1px solid #E8D5C4}
    .precio{color:#2a6040;font-weight:700}
    footer{background:var(--cafe-oscuro);border-top:1px solid var(--linea-footer);text-align:center;padding:1.4rem;color:rgba(245,241,233,.7);font-size:.82rem}
  </style>
</head>
<body>
<nav>
  <a href="/" class="brand"><span>BRUMA</span></a>
  <a th:href="@{/}">Dashboard</a>
  <a th:href="@{/clientes}" sec:authorize="hasRole('ADMIN')">Clientes</a>
  <a th:href="@{/productos}" class="active">Productos</a>
  <a th:href="@{/pedidos}">Pedidos</a>
  <a th:href="@{/reportes}" sec:authorize="hasRole('ADMIN')">Reportes</a>
  <a th:href="@{/respaldos}" sec:authorize="hasRole('ADMIN')">Respaldos</a>
  <a th:href="@{/usuarios/nuevo}" sec:authorize="hasRole('ADMIN')">Usuarios</a>
  <div class="user-badge">
    <span sec:authentication="name">Usuario</span>
    <span sec:authorize="hasRole('ADMIN')" class="role-badge admin">Admin</span>
    <span sec:authorize="hasRole('CAJERO')" class="role-badge cajero">Cajero</span>
    <span sec:authorize="hasRole('MESERO')" class="role-badge mesero">Mesero</span>
  </div>
  <form th:action="@{/logout}" method="post" style="display:inline">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" class="btn-logout">Salir</button>
  </form>
</nav>

<div class="container">
  <div class="page-hdr">
    <h1>Productos</h1>
    <button onclick="document.getElementById('fp').style.display='block';this.style.display='none'"
            class="btn btn-gold" sec:authorize="hasRole('ADMIN')">+ Nuevo Producto</button>
  </div>

  <div id="fp" style="display:none" sec:authorize="hasRole('ADMIN')">
    <div class="form-card">
      <h3>Agregar producto</h3>
      <form th:action="@{/productos/guardar}" method="post" th:object="${productoForm}">
        <input type="hidden" th:field="*{idProducto}"/>
        <div class="fg"><label>Nombre</label>
          <input type="text" th:field="*{nombre}" required placeholder="Ej: Café Americano"/></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem">
          <div class="fg"><label>Precio (S/)</label>
            <input type="number" th:field="*{precio}" step="0.10" min="0" required placeholder="8.50"/></div>
          <div class="fg"><label>Categoría</label>
            <select th:field="*{categoria}">
              <option value="Bebida">Bebida</option>
              <option value="Comida">Comida</option>
              <option value="Postre">Postre</option>
              <option value="Otro">Otro</option>
            </select></div>
        </div>
        <div class="fg"><label>Descripción</label>
          <textarea th:field="*{descripcion}" rows="2" placeholder="Descripción breve..."></textarea></div>
        <div class="row">
          <button type="submit" class="btn btn-green">Guardar</button>
          <button type="button" onclick="document.getElementById('fp').style.display='none'"
                  class="btn btn-red">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Nombre</th><th>Precio</th>
          <!-- FIX 5: Categoría siempre visible -->
          <th>Categoría</th>
          <th>Descripción</th>
          <th sec:authorize="hasRole('ADMIN')">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="p : ${productos}">
          <td th:text="${p.idProducto}"></td>
          <td style="font-weight:600" th:text="${p.nombre}"></td>
          <td class="precio">S/ <span th:text="${#numbers.formatDecimal(p.precio,1,2)}"></span></td>
          <td>
            <!-- FIX #7: la BD guarda 'Bebidas','Comidas','Postres' (plural).
                 Se añaden ambas formas para cubrir cualquier variante existente. -->
            <span th:switch="${p.categoria}">
              <span th:case="'Bebidas'" class="badge b-beb" th:text="${p.categoria}"></span>
              <span th:case="'Bebida'"  class="badge b-beb" th:text="${p.categoria}"></span>
              <span th:case="'Comidas'" class="badge b-com" th:text="${p.categoria}"></span>
              <span th:case="'Comida'"  class="badge b-com" th:text="${p.categoria}"></span>
              <span th:case="'Postres'" class="badge b-pos" th:text="${p.categoria}"></span>
              <span th:case="'Postre'"  class="badge b-pos" th:text="${p.categoria}"></span>
              <span th:case="*"         class="badge b-otr" th:text="${p.categoria} ?: 'Sin cat.'"></span>
            </span>
          </td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--marron)"
              th:text="${p.descripcion}"></td>
          <td sec:authorize="hasRole('ADMIN')">
            <div style="display:flex;gap:.4rem">
              <a th:href="@{/productos/editar/{id}(id=${p.idProducto})}" class="btn btn-gold btn-sm">Editar</a>
              <a th:href="@{/productos/eliminar/{id}(id=${p.idProducto})}"
                 class="btn btn-red btn-sm" onclick="return confirm('¿Eliminar producto?')">Eliminar</a>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(productos)}">
          <td colspan="6" style="text-align:center;color:var(--marron);padding:2.5rem">Sin productos registrados.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<footer>BRUMA Cafetería © 2025</footer>
</body>
</html>
