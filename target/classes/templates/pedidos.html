<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pedidos  BRUMA</title>
  <style>
:root {
  --verde-oscuro: #26382E;
  --crema: #F5F1E9;
  --verde-claro: #BFD9C3;
  --cafe-oscuro: #2C1B0E;
  --marron: #4E342E;
  --crema-calida: #E8D5C4;
  --blanco-calido: #EDE5E1;
  --overlay: rgba(0,0,0,0.6);
  --sombra: rgba(0,0,0,0.2);
  --linea-footer: rgba(255,255,255,0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--crema);
  color: var(--cafe-oscuro);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
/* NAV */
nav {
  background: var(--verde-oscuro);
  border-bottom: 3px solid var(--verde-claro);
  padding: 0 2rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  height: 68px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 16px var(--sombra);
}
.brand {
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--crema);
  text-decoration: none;
  margin-right: auto;
  letter-spacing: 3px;
  text-transform: uppercase;
}
.brand span { color: var(--verde-claro); }
nav a {
  color: var(--blanco-calido);
  text-decoration: none;
  padding: .45rem 1rem;
  border-radius: 6px;
  font-size: .9rem;
  font-weight: 500;
  transition: all .25s;
  border: 1px solid transparent;
}
nav a:hover, nav a.active {
  background: var(--verde-claro);
  color: var(--verde-oscuro);
  font-weight: 700;
  border-color: var(--verde-claro);
}
.user-badge {
  display: flex;
  align-items: center;
  gap: .7rem;
  background: rgba(191,217,195,0.12);
  border: 1px solid rgba(191,217,195,0.4);
  border-radius: 20px;
  padding: .4rem 1rem;
  font-size: .85rem;
  color: var(--crema);
  margin-left: auto;
  font-weight: 600;
}
.role-badge {
  display: inline-block;
  padding: .2rem .7rem;
  border-radius: 12px;
  font-size: .72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.role-badge.admin {
  background: rgba(78,52,46,.5);
  color: var(--crema-calida);
  border: 1px solid var(--crema-calida);
}
.role-badge.cajero {
  background: rgba(191,217,195,.2);
  color: var(--verde-claro);
  border: 1px solid var(--verde-claro);
}
.btn-logout {
  background: transparent;
  border: 1px solid rgba(237,229,225,.4);
  color: var(--blanco-calido);
  padding: .4rem 1rem;
  border-radius: 6px;
  font-size: .85rem;
  font-weight: 600;
  text-decoration: none;
  transition: all .25s;
}
.btn-logout:hover {
  background: rgba(237,229,225,.15);
  border-color: var(--blanco-calido);
}
/* CONTAINER */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2.5rem 2rem;
  flex: 1;
}
.page-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 2px solid var(--verde-claro);
}
.page-hdr h1 {
  font-size: 1.8rem;
  color: var(--verde-oscuro);
  font-weight: 800;
  letter-spacing: .5px;
}
/* CARDS */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 1.5rem;
  margin-bottom: 2.5rem;
}
.card {
  background: var(--blanco-calido);
  border: 1px solid var(--crema-calida);
  border-radius: 14px;
  padding: 1.8rem;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: all .3s;
  box-shadow: 0 2px 10px var(--sombra);
}
.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 10px 28px var(--sombra);
  border-color: var(--verde-claro);
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--verde-oscuro), var(--verde-claro));
}
.card .num {
  font-size: 2.6rem;
  font-weight: 900;
  color: var(--verde-oscuro);
  line-height: 1;
  margin: .5rem 0;
}
.card .lbl {
  color: var(--marron);
  font-size: .9rem;
  font-weight: 600;
  margin-top: .6rem;
}
/* TABLA */
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 10px var(--sombra);
}
.tbl-wrap {
  overflow-x: auto;
  border-radius: 10px;
  border: 1px solid var(--crema-calida);
}
thead tr { background: var(--verde-oscuro); }
th {
  padding: .9rem 1.1rem;
  text-align: left;
  color: var(--crema);
  font-size: .8rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 700;
}
td {
  padding: .9rem 1.1rem;
  color: var(--cafe-oscuro);
  font-size: .92rem;
  border-bottom: 1px solid var(--blanco-calido);
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(191,217,195,.1); }
/* BOTONES */
.btn {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  padding: .55rem 1.1rem;
  border-radius: 7px;
  font-size: .85rem;
  font-weight: 700;
  border: none;
  cursor: pointer;
  text-decoration: none;
  transition: all .25s;
  text-transform: uppercase;
  letter-spacing: .4px;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 4px 14px var(--sombra); }
.btn-gold {
  background: var(--verde-oscuro);
  color: var(--crema);
  border: 1px solid var(--verde-oscuro);
}
.btn-gold:hover { background: #1a2b21; }
.btn-green {
  background: var(--verde-claro);
  color: var(--verde-oscuro);
  border: 1px solid var(--verde-claro);
  font-weight: 800;
}
.btn-red {
  background: var(--marron);
  color: white;
  border: 1px solid var(--marron);
}
.btn-blue {
  background: var(--blanco-calido);
  color: var(--verde-oscuro);
  border: 1px solid var(--crema-calida);
}
.btn-blue:hover { background: var(--crema-calida); }
.btn-sm { padding: .3rem .7rem; font-size: .75rem; }
/* FORMULARIOS */
.form-card {
  background: white;
  border: 1px solid var(--crema-calida);
  border-radius: 14px;
  padding: 2rem;
  max-width: 560px;
  box-shadow: 0 4px 18px var(--sombra);
}
.form-card h3 {
  color: var(--verde-oscuro);
  margin-bottom: 1.4rem;
  font-size: 1.1rem;
  font-weight: 800;
}
.fg { margin-bottom: 1.2rem; }
.fg label {
  display: block;
  margin-bottom: .4rem;
  color: var(--marron);
  font-size: .8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .05em;
}
.fg input, .fg select, .fg textarea {
  width: 100%;
  padding: .75rem 1rem;
  background: var(--crema);
  border: 1.5px solid var(--crema-calida);
  border-radius: 8px;
  color: var(--cafe-oscuro);
  font-size: .93rem;
  outline: none;
  transition: all .25s;
}
.fg input:focus, .fg select:focus, .fg textarea:focus {
  border-color: var(--verde-claro);
  box-shadow: 0 0 0 3px rgba(191,217,195,.25);
  background: white;
}
.row { display: flex; gap: 1rem; margin-top: 1.4rem; }
/* BADGES */
.badge {
  display: inline-block;
  padding: .25rem .65rem;
  border-radius: 10px;
  font-size: .72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .4px;
}
.chip { display: inline-block; padding: .2rem .55rem; border-radius: 10px; font-size: .72rem; font-weight: 700; }
.b-beb { background: rgba(38,56,46,.1); color: var(--verde-oscuro); border: 1px solid var(--verde-oscuro); }
.b-com { background: rgba(191,217,195,.3); color: #2a6040; border: 1px solid var(--verde-claro); }
.b-pos { background: rgba(232,213,196,.5); color: var(--marron); border: 1px solid var(--crema-calida); }
.b-otr { background: var(--blanco-calido); color: var(--cafe-oscuro); border: 1px solid var(--crema-calida); }
.b-pg  { background: rgba(38,56,46,.12); color: var(--verde-oscuro); border: 1px solid var(--verde-oscuro); }
.b-mg  { background: rgba(191,217,195,.3); color: #2a6040; border: 1px solid var(--verde-claro); }
/* INFO BOXES */
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 2rem; }
.info-box {
  background: white;
  border: 1px solid var(--crema-calida);
  border-radius: 14px;
  padding: 1.5rem;
  box-shadow: 0 2px 10px var(--sombra);
}
.info-box h3 {
  color: var(--verde-oscuro);
  margin-bottom: .7rem;
  font-size: .95rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: .5rem;
  border-bottom: 1px solid var(--blanco-calido);
  padding-bottom: .6rem;
}
/* REPORTES */
.rpt-card {
  background: white;
  border: 1px solid var(--crema-calida);
  border-radius: 14px;
  padding: 1.8rem;
  margin-bottom: 1.8rem;
  box-shadow: 0 2px 10px var(--sombra);
}
.rpt-card h3 {
  color: var(--verde-oscuro);
  margin-bottom: .5rem;
  font-size: 1rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: .6rem;
  flex-wrap: wrap;
}
.rpt-card p { color: var(--marron); font-size: .88rem; margin-bottom: 1.1rem; line-height: 1.6; }
/* ALERTAS */
.alert { padding: .9rem 1.2rem; border-radius: 10px; margin-bottom: 1.2rem; font-size: .9rem; border-left: 4px solid; }
.alert-warn { background: rgba(232,213,196,.3); border-color: var(--marron); color: var(--marron); }
.alert-error { background: rgba(78,52,46,.1); border-color: var(--marron); color: var(--marron); }
.alert-ok { background: rgba(191,217,195,.25); border-color: var(--verde-claro); color: #2a6040; }
/* FLOW */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.8rem; }
.flow-box { background: var(--blanco-calido); border-radius: 10px; padding: 1.1rem; display: flex; flex-direction: column; gap: .8rem; border: 1px solid var(--crema-calida); }
.flow-item { border-radius: 8px; padding: 1rem; background: white; }
.flow-item-pg { border-left: 4px solid var(--verde-oscuro); }
.flow-item-mg { border-left: 4px solid var(--verde-claro); }
.flow-item-res { border-left: 4px solid var(--marron); }
.flow-arrow { text-align: center; color: var(--verde-oscuro); font-size: 1rem; font-weight: 700; padding: .2rem 0; }
/* DATA GRID */
.data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-top: .8rem; }
.data-item small { display: block; color: var(--marron); font-size: .73rem; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .2rem; }
.data-item strong { color: var(--cafe-oscuro); font-size: .93rem; }
.com-item { border-left: 3px solid var(--verde-claro); border-radius: 0 8px 8px 0; padding: .6rem .9rem; margin-bottom: .5rem; background: var(--blanco-calido); }
.com-txt { color: var(--cafe-oscuro); font-size: .88rem; }
.com-fecha { color: var(--marron); font-size: .72rem; margin-top: .2rem; }
/* PEDIDO LINEA */
.pedido-linea { display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: center; background: var(--blanco-calido); border: 1px solid var(--crema-calida); border-radius: 8px; padding: .65rem 1rem; margin-bottom: .5rem; }
.pedido-linea select, .pedido-linea input { background: white; border: 1.5px solid var(--crema-calida); border-radius: 6px; color: var(--cafe-oscuro); padding: .45rem .65rem; font-size: .88rem; outline: none; }
.pedido-linea select:focus, .pedido-linea input:focus { border-color: var(--verde-claro); }
.pedido-linea input { width: 80px; }
/* FOOTER */
footer {
  background: var(--cafe-oscuro);
  border-top: 1px solid var(--linea-footer);
  text-align: center;
  padding: 1.4rem;
  color: rgba(245,241,233,0.7);
  font-size: .82rem;
  font-weight: 500;
  letter-spacing: .5px;
}
@media (max-width: 768px) {
  .two-col, .info-grid { grid-template-columns: 1fr; }
  nav { padding: 0 1rem; gap: .4rem; height: auto; flex-wrap: wrap; padding-block: .6rem; }
  .container { padding: 1.5rem 1rem; }
  .page-hdr { flex-direction: column; align-items: flex-start; gap: .8rem; }
}
@media (max-width: 480px) {
  .cards { grid-template-columns: 1fr; }
  .row { flex-direction: column; }
  .btn { width: 100%; justify-content: center; }
}
</style>
</head>
<body>
<nav>
  <a href="/" class="brand"><span>BRUMA</span></a>
  <a th:href="@{/}">Dashboard</a>
  <a th:href="@{/clientes}" sec:authorize="hasRole('ADMIN')">Clientes</a>
  <a th:href="@{/productos}">Productos</a>
  <a th:href="@{/pedidos}" class="active">Pedidos</a>
  <a th:href="@{/reportes}" sec:authorize="hasRole('ADMIN')">Reportes</a>
  <a th:href="@{/respaldos}" sec:authorize="hasRole('ADMIN')">Respaldos</a>
  <a th:href="@{/usuarios/nuevo}" sec:authorize="hasRole('ADMIN')">Usuarios</a>
  <div class="user-badge">
    <span sec:authentication="name">Usuario</span>
    <span sec:authorize="hasRole('ADMIN')" class="role-badge admin">Admin</span>
    <span sec:authorize="hasRole('CAJERO')" class="role-badge cajero">Cajero</span>
    <span sec:authorize="hasRole('MESERO')" class="role-badge mesero">Mesero</span>
  </div>
  <form th:action="@{/logout}" method="post" style="display:inline">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" class="btn-logout">Salir</button>
  </form>
</nav>

<div class="container">
  <div class="page-hdr">
    <h1>Pedidos</h1>
    <a th:href="@{/pedidos/nuevo}" class="btn btn-gold">+ Nuevo Pedido</a>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead><tr><th>#</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estado</th><th></th></tr></thead>
      <tbody>
        <tr th:each="p : ${pedidos}">
          <td style="" th:text="${p.idPedido}"></td>
          <td style="font-weight:600" th:text="${p.cliente.nombre}"></td>
          <td th:text="${p.fechaPedido}"></td>
          <td style=";font-weight:700">S/ <span th:text="${#numbers.formatDecimal(p.total,1,2)}"></span></td>
          <td><span class="badge b-mg">Registrado</span></td>
          <td><a th:href="@{/pedidos/ver/{id}(id=${p.idPedido})}" class="btn btn-blue btn-sm">Ver</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(pedidos)}">
          <td colspan="6" style="text-align:center;;padding:2.5rem">Sin pedidos.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<footer>BRUMA Cafetería © 2025</footer>
</body>
</html>
