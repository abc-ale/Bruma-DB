<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pedidos — BRUMA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --verde-oscuro: #26382E; --verde-profundo: #16221b; --verde-medio: #34503F;
  --crema: #F5F1E9; --verde-claro: #BFD9C3; --cafe-oscuro: #2C1B0E; --marron: #4E342E;
  --crema-calida: #E8D5C4; --blanco-calido: #EDE5E1;
  --terracota: #C1652F; --terracota-suave: #E8935F; --dorado: #C9962C;
  --sombra: rgba(38,56,46,0.16); --linea-footer: rgba(255,255,255,0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--crema); color: var(--cafe-oscuro); min-height: 100vh; display: flex; flex-direction: column; }
h1, h3, .brand { font-family: 'Playfair Display', Georgia, serif; }
@keyframes aparecer { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes subirVapor { 0% { transform: translateY(0) scaleX(1); opacity: 0; } 20% { opacity: 1; } 80% { opacity: .55; } 100% { transform: translateY(-70px) scaleX(2.2); opacity: 0; } }
@keyframes flotar { 0%, 100% { transform: translateY(0) translateX(0); opacity: .5; } 50% { transform: translateY(-14px) translateX(6px); opacity: 1; } }
@keyframes pulsoSombra { 0%, 100% { box-shadow: 0 4px 14px var(--sombra); } 50% { box-shadow: 0 12px 30px rgba(193,101,47,.22); } }
@keyframes rippleEffect { to { transform: scale(4); opacity: 0; } }

/* NAV */
nav { background: linear-gradient(120deg, var(--verde-oscuro) 0%, var(--verde-profundo) 100%); border-bottom: 3px solid var(--terracota); padding: 0 2rem; display: flex; align-items: center; gap: .3rem; height: 68px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 16px var(--sombra); }
.brand { display: flex; align-items: center; gap: .6rem; font-size: 1.25rem; font-weight: 700; color: var(--crema); text-decoration: none; margin-right: 1.4rem; letter-spacing: 1.5px; text-transform: uppercase; }
.brand img { height: 40px; width: 40px; object-fit: contain; border-radius: 50%; border: 1.5px solid var(--terracota-suave); background: rgba(14,27,19,.6); padding: 2px; }
.brand span { color: var(--terracota-suave); }
nav a:not(.brand) { color: var(--blanco-calido); text-decoration: none; padding: .5rem 1.05rem; border-radius: 20px; font-size: .87rem; font-weight: 500; transition: all .25s; border: 1px solid transparent; }
nav a:not(.brand):hover, nav a.active { background: var(--terracota); color: var(--crema); font-weight: 700; border-color: var(--terracota); }
.user-badge { display: flex; align-items: center; gap: .7rem; background: rgba(191,217,195,0.12); border: 1px solid rgba(191,217,195,0.4); border-radius: 20px; padding: .4rem 1rem; font-size: .85rem; color: var(--crema); margin-left: auto; font-weight: 600; }
.user-badge i { color: var(--terracota-suave); font-size: 1rem; }
.role-badge { display: inline-block; padding: .2rem .7rem; border-radius: 12px; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.role-badge.admin { background: rgba(193,101,47,.35); color: var(--terracota-suave); border: 1px solid var(--terracota-suave); }
.role-badge.cajero { background: rgba(191,217,195,.2); color: var(--verde-claro); border: 1px solid var(--verde-claro); }
.btn-logout { background: transparent; border: 1px solid rgba(237,229,225,.4); color: var(--blanco-calido); padding: .45rem 1.1rem; border-radius: 20px; font-size: .85rem; font-weight: 600; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: .4rem; transition: all .25s; }
.btn-logout:hover { background: rgba(237,229,225,.15); border-color: var(--blanco-calido); transform: translateY(-1px); }

/* HERO */
.hero { position: relative; overflow: hidden; background: linear-gradient(150deg, var(--verde-oscuro) 0%, #182720 55%, var(--verde-profundo) 100%); padding: 2.6rem 2rem 2.2rem; }
.hero::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 85% 0%, rgba(193,101,47,.18), transparent 55%); pointer-events: none; }
.bg-steam { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.steam { position: absolute; bottom: -40px; border-radius: 50%; background: rgba(191,217,195,.06); filter: blur(16px); animation: subirVapor 11s ease-in-out infinite; }
.steam.s1 { left: 12%; width: 140px; height: 240px; animation-duration: 12s; }
.steam.s2 { left: 45%; width: 170px; height: 280px; animation-delay: 3s; animation-duration: 15s; }
.steam.s3 { left: 78%; width: 120px; height: 210px; animation-delay: 6s; animation-duration: 10s; }
.particula { position: absolute; border-radius: 50%; background: var(--terracota-suave); opacity: .6; animation: flotar 6s ease-in-out infinite; pointer-events: none; }
.p1 { width: 8px; height: 8px; top: 24px; right: 60px; }
.p2 { width: 5px; height: 5px; top: 60px; right: 120px; animation-delay: 1.4s; }
.p3 { width: 6px; height: 6px; bottom: 20px; right: 40px; animation-delay: 2.8s; }
.hero-inner { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; animation: aparecer .6s ease; }
.hero-inner h1 { font-size: 2rem; color: var(--crema); font-weight: 700; }
.hero-inner small { color: var(--terracota-suave); font-weight: 700; font-size: .8rem; letter-spacing: .04em; }

.container { max-width: 1200px; margin: 0 auto; padding: 2.2rem 2rem 2.5rem; flex: 1; width: 100%; }

/* CARDS */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2.8rem; margin-top: -3.6rem; position: relative; z-index: 2; }
.card { background: #ffffff; border: 1px solid rgba(0,0,0,.04); border-radius: 18px; padding: 1.7rem 1.8rem; display: flex; align-items: center; gap: 1.2rem; position: relative; overflow: hidden; transition: all .35s cubic-bezier(.22,1,.36,1); animation: aparecer .5s ease backwards, pulsoSombra 6s ease-in-out infinite; box-shadow: 0 6px 20px rgba(0,0,0,.1); }
.card:hover { transform: translateY(-7px) scale(1.01); }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, var(--dorado), #e0b04a); }
.card-icon { flex-shrink: 0; width: 56px; height: 56px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: #fff; background: linear-gradient(145deg, var(--dorado), #e0b04a); }
.card .num { font-size: 2.4rem; font-weight: 900; color: var(--cafe-oscuro); line-height: 1; }
.card .lbl { color: var(--marron); font-size: .85rem; font-weight: 600; margin-top: .3rem; }

/* TABLA */
table { width: 100%; table-layout: fixed; border-collapse: collapse; background: white; }
.tbl-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid rgba(0,0,0,.05); box-shadow: 0 6px 20px rgba(0,0,0,.08); animation: aparecer .5s ease .2s backwards; }
thead tr { background: linear-gradient(90deg, var(--verde-oscuro), var(--verde-medio)); }
th { padding: 1rem .8rem; text-align: center; color: var(--crema); font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; white-space: nowrap; }
th:nth-child(1) { width: 8%; }
th:nth-child(2) { width: 22%; }
th:nth-child(3) { width: 18%; }
th:nth-child(4) { width: 16%; }
th:nth-child(5) { width: 16%; }
th:nth-child(6) { width: 20%; }
td { padding: 1rem .8rem; text-align: center; color: var(--cafe-oscuro); font-size: .92rem; border-bottom: 1px solid var(--blanco-calido); overflow: hidden; text-overflow: ellipsis; }
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background .2s; }
tbody tr:hover { background: rgba(193,101,47,.06); }
.pedido-id { color: var(--terracota); font-weight: 800; }
.pedido-total { display: inline-block; background: rgba(193,101,47,.1); color: var(--terracota); font-weight: 800; padding: .3rem .8rem; border-radius: 20px; font-size: .88rem; }

/* BOTONES */
.btn { display: inline-flex; align-items: center; gap: .4rem; padding: .6rem 1.2rem; border-radius: 20px; font-size: .82rem; font-weight: 700; border: none; cursor: pointer; text-decoration: none; position: relative; overflow: hidden; transition: all .3s cubic-bezier(.22,1,.36,1); text-transform: uppercase; letter-spacing: .4px; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--sombra); }
.btn-gold { background: linear-gradient(135deg, var(--terracota), var(--terracota-suave)); color: white; border: none; }
.btn-gold:hover { filter: brightness(1.08); }
.btn-blue { background: white; color: var(--verde-oscuro); border: 1px solid var(--crema-calida); }
.btn-sm { padding: .4rem .9rem; font-size: .74rem; }
.ripple { position: absolute; background: rgba(255,255,255,.5); border-radius: 50%; transform: scale(0); animation: rippleEffect .6s linear; pointer-events: none; }

/* BADGES */
.badge { display: inline-block; padding: .3rem .75rem; border-radius: 20px; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
.b-mg { background: rgba(191,217,195,.35); color: #2a6040; border: 1px solid var(--verde-claro); }

/* FOOTER */
.foot-v6 { background: var(--cafe-oscuro); border-top: 1px solid var(--linea-footer); padding: 1.8rem 2rem; margin-top: auto; }
.foot-v6-inner { max-width: 600px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: .5rem; }
.foot-v6-brand { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--crema); font-size: .95rem; letter-spacing: 1px; text-transform: uppercase; }
.foot-v6-brand span { color: var(--terracota-suave); }
.foot-v6-sub { color: rgba(245,241,233,.5); font-size: .8rem; }

@media (max-width: 768px) {
  nav { padding: 0 1rem; gap: .3rem; height: auto; flex-wrap: wrap; padding-block: .6rem; }
  .container { padding: 1.5rem 1rem; }
  .hero { padding: 2rem 1rem 3.2rem; }
  .cards { margin-top: -2.6rem; }
}
@media (max-width: 480px) { .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<nav>
  <a href="/" class="brand"><img th:src="@{/img/LOGO2.png}" src="/img/LOGO2.png" alt="Logo Bruma"><span>BRUMA</span></a>
  <a th:href="@{/}">Dashboard</a>
  <a th:href="@{/clientes}" sec:authorize="hasRole('ADMIN')">Clientes</a>
  <a th:href="@{/productos}">Productos</a>
  <a th:href="@{/pedidos}" class="active">Pedidos</a>
  <a th:href="@{/reportes}" sec:authorize="hasRole('ADMIN')">Reportes</a>
  <a th:href="@{/respaldos}" sec:authorize="hasRole('ADMIN')">Respaldos</a>
  <a th:href="@{/usuarios/nuevo}" sec:authorize="hasRole('ADMIN')">Usuarios</a>
  <div class="user-badge">
    <i class="ti ti-user-circle"></i>
    <span sec:authentication="name">Usuario</span>
    <span sec:authorize="hasRole('ADMIN')" class="role-badge admin">Admin</span>
    <span sec:authorize="hasRole('CAJERO')" class="role-badge cajero">Cajero</span>
    <span sec:authorize="hasRole('MESERO')" class="role-badge mesero">Mesero</span>
  </div>
  <form th:action="@{/logout}" method="post" style="display:inline">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" class="btn-logout"><i class="ti ti-logout"></i> Salir</button>
  </form>
</nav>

<div class="hero">
  <div class="bg-steam"><div class="steam s1"></div><div class="steam s2"></div><div class="steam s3"></div></div>
  <div class="particula p1"></div><div class="particula p2"></div><div class="particula p3"></div>
  <div class="hero-inner">
    <div>
      <h1>Pedidos</h1>
      <small>BRUMA Cafetería — Historial de ventas</small>
    </div>
    <a th:href="@{/pedidos/nuevo}" class="btn btn-gold">+ Nuevo Pedido</a>
  </div>
</div>

<div class="container">
  <div class="cards">
    <div class="card">
      <div class="card-icon"><i class="ti ti-receipt"></i></div>
      <div>
        <div class="num" th:text="${#lists.size(pedidos)}">0</div>
        <div class="lbl">Pedidos registrados</div>
      </div>
    </div>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead><tr><th>#</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estado</th><th></th></tr></thead>
      <tbody>
        <tr th:each="p : ${pedidos}">
          <td class="pedido-id" th:text="${p.idPedido}"></td>
          <td style="font-weight:600" th:text="${p.cliente.nombre}"></td>
          <td th:text="${#temporals.format(p.fechaPedido, 'dd/MM/yyyy HH:mm')}"></td>
          <td><span class="pedido-total">S/ <span th:text="${#numbers.formatDecimal(p.total,1,2)}"></span></span></td>
          <td><span class="badge b-mg">Registrado</span></td>
          <td><a th:href="@{/pedidos/ver/{id}(id=${p.idPedido})}" class="btn btn-blue btn-sm">Ver</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(pedidos)}">
          <td colspan="6" style="text-align:center;padding:2.5rem">Sin pedidos.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<footer class="foot-v6">
  <div class="foot-v6-inner">
    <span class="foot-v6-brand">BRUMA <span>Cafetería</span></span>
    <span class="foot-v6-sub">Sistema de Gestión Dual DB · © 2025</span>
  </div>
</footer>

<script>
  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', function (e) {
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const rect = this.getBoundingClientRect();
      ripple.style.left = (e.clientX - rect.left) + 'px';
      ripple.style.top  = (e.clientY - rect.top) + 'px';
      ripple.style.width = ripple.style.height = Math.max(rect.width, rect.height) + 'px';
      this.appendChild(ripple);
      setTimeout(() => ripple.remove(), 650);
    });
  });
</script>
</body>
</html>
