<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cliente — BRUMA</title>
  <link rel="stylesheet" th:href="@{/css/bruma.css}"/>
  <style>
    :root{--verde-oscuro:#26382E;--crema:#F5F1E9;--verde-claro:#BFD9C3;--cafe-oscuro:#2C1B0E;--marron:#4E342E;--crema-calida:#E8D5C4;--blanco-calido:#EDE5E1;--sombra:rgba(0,0,0,0.2);--linea-footer:rgba(255,255,255,0.1);}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:var(--crema);color:var(--cafe-oscuro);min-height:100vh;display:flex;flex-direction:column}
    nav{background:var(--verde-oscuro);border-bottom:3px solid var(--verde-claro);padding:0 2rem;display:flex;align-items:center;gap:1rem;height:68px;position:sticky;top:0;z-index:100;box-shadow:0 4px 16px var(--sombra)}
    .brand{font-size:1.4rem;font-weight:900;color:var(--crema);text-decoration:none;margin-right:auto;letter-spacing:3px;text-transform:uppercase}.brand span{color:var(--verde-claro)}
    nav a{color:var(--blanco-calido);text-decoration:none;padding:.45rem 1rem;border-radius:6px;font-size:.9rem;font-weight:500;transition:all .25s;border:1px solid transparent}
    nav a:hover,nav a.active{background:var(--verde-claro);color:var(--verde-oscuro);font-weight:700;border-color:var(--verde-claro)}
    .user-badge{display:flex;align-items:center;gap:.7rem;background:rgba(191,217,195,.12);border:1px solid rgba(191,217,195,.4);border-radius:20px;padding:.4rem 1rem;font-size:.85rem;color:var(--crema);margin-left:auto}
    .btn-logout{background:transparent;border:1px solid rgba(237,229,225,.4);color:var(--blanco-calido);padding:.4rem 1rem;border-radius:6px;font-size:.85rem;cursor:pointer;transition:all .25s}
    .btn-logout:hover{background:rgba(237,229,225,.15)}
    .container{max-width:600px;margin:2.5rem auto;padding:0 1.5rem;flex:1}
    .page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;padding-bottom:1rem;border-bottom:2px solid var(--verde-claro)}
    .page-hdr h1{font-size:1.8rem;color:var(--verde-oscuro);font-weight:800}
    .form-card{background:white;border:1px solid var(--crema-calida);border-radius:14px;padding:2rem;box-shadow:0 4px 18px var(--sombra)}
    .fg{margin-bottom:1.2rem}.fg label{display:block;margin-bottom:.4rem;color:var(--marron);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
    .fg input,.fg select{width:100%;padding:.75rem 1rem;background:var(--crema);border:1.5px solid var(--crema-calida);border-radius:8px;color:var(--cafe-oscuro);font-size:.93rem;outline:none;transition:all .25s}
    .fg input:focus,.fg select:focus{border-color:var(--verde-claro);box-shadow:0 0 0 3px rgba(191,217,195,.25);background:white}
    .fg small{color:var(--marron);font-size:.75rem;margin-top:.3rem;display:block}
    .row{display:flex;gap:1rem;margin-top:1.4rem}
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;border-radius:7px;font-size:.85rem;font-weight:700;border:none;cursor:pointer;text-decoration:none;transition:all .25s}
    .btn-green{background:var(--verde-claro);color:var(--verde-oscuro);border:1px solid var(--verde-claro)}
    .btn-red{background:var(--marron);color:white;border:1px solid var(--marron)}
    .btn-gold{background:var(--verde-oscuro);color:var(--crema);border:1px solid var(--verde-oscuro)}
    .btn-sm{padding:.3rem .7rem;font-size:.75rem}
    .alert{padding:.9rem 1.2rem;border-radius:10px;margin-bottom:1.2rem;font-size:.9rem;border-left:4px solid}
    .alert-ok{background:rgba(191,217,195,.25);border-color:var(--verde-claro);color:#2a6040}
    .alert-error{background:rgba(78,52,46,.1);border-color:var(--marron);color:var(--marron)}
    footer{background:var(--cafe-oscuro);border-top:1px solid var(--linea-footer);text-align:center;padding:1.4rem;color:rgba(245,241,233,.7);font-size:.82rem}
  </style>
</head>
<body>
<nav>
  <a href="/" class="brand"><span>BRUMA</span></a>
  <a th:href="@{/}">Dashboard</a>
  <a th:href="@{/clientes}" sec:authorize="hasRole('ADMIN')" class="active">Clientes</a>
  <a th:href="@{/productos}">Productos</a>
  <a th:href="@{/pedidos}">Pedidos</a>
  <a th:href="@{/reportes}" sec:authorize="hasRole('ADMIN')">Reportes</a>
  <a th:href="@{/respaldos}" sec:authorize="hasRole('ADMIN')">Respaldos</a>
  <a th:href="@{/usuarios/nuevo}" sec:authorize="hasRole('ADMIN')">Usuarios</a>
  <div class="user-badge">
    <span sec:authentication="name">Usuario</span>
    <span sec:authorize="hasRole('ADMIN')" class="role-badge admin">Admin</span>
    <span sec:authorize="hasRole('CAJERO')" class="role-badge cajero">Cajero</span>
    <span sec:authorize="hasRole('MESERO')" class="role-badge mesero">Mesero</span>
  </div>
  <form th:action="@{/logout}" method="post" style="display:inline">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" class="btn-logout">Salir</button>
  </form>
</nav>

<div class="container">
  <div class="page-hdr">
    <h1 th:text="${clienteForm.idCliente == null} ? 'Nuevo Cliente' : 'Editar Cliente'">Cliente</h1>
    <a th:href="@{/clientes}" class="btn btn-gold btn-sm">← Volver</a>
  </div>

  <div th:if="${ok}"    class="alert alert-ok"    th:text="${ok}"></div>
  <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

  <div class="form-card">
    <!-- FIX 2: campos correctos según entidad Cliente (nombre + dni) -->
    <form th:action="@{/clientes/guardar}" method="post" th:object="${clienteForm}">
      <input type="hidden" th:field="*{idCliente}"/>
      <input type="hidden" th:field="*{fechaRegistro}"/>

      <div class="fg">
        <label>Nombre completo *</label>
        <input type="text" th:field="*{nombre}" required placeholder="Ej: María López"/>
      </div>
      <div class="fg">
        <label>DNI / Documento</label>
        <input type="text" th:field="*{dni}" placeholder="Ej: 12345678" maxlength="20"/>
        <small>Identificador único del cliente en el programa de fidelización.</small>
      </div>

      <div class="row">
        <button type="submit" class="btn btn-green">Guardar</button>
        <a th:href="@{/clientes}" class="btn btn-red">Cancelar</a>
      </div>
    </form>
  </div>
</div>
<footer>BRUMA Cafetería © 2025</footer>
</body>
</html>
