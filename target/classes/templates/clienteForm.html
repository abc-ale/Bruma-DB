<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cliente — BRUMA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --verde-oscuro: #26382E;
  --verde-profundo: #16221b;
  --verde-medio: #34503F;
  --crema: #F5F1E9;
  --verde-claro: #BFD9C3;
  --cafe-oscuro: #2C1B0E;
  --marron: #4E342E;
  --crema-calida: #E8D5C4;
  --blanco-calido: #EDE5E1;
  --terracota: #C1652F;
  --terracota-suave: #E8935F;
  --sombra: rgba(38,56,46,0.16);
  --linea-footer: rgba(255,255,255,0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Segoe UI', sans-serif;
  background: var(--crema);
  color: var(--cafe-oscuro);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
h1, h3, .brand { font-family: 'Playfair Display', Georgia, serif; }
@keyframes aparecer { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes subirVapor {
  0%   { transform: translateY(0) scaleX(1);       opacity: 0; }
  20%  { opacity: 1; }
  80%  { opacity: .55; }
  100% { transform: translateY(-70px) scaleX(2.2); opacity: 0; }
}
@keyframes flotar {
  0%, 100% { transform: translateY(0) translateX(0);       opacity: .5; }
  50%      { transform: translateY(-14px) translateX(6px); opacity: 1; }
}
@keyframes rippleEffect { to { transform: scale(4); opacity: 0; } }

/* NAV — idéntico a dashboard.html / clientes.html */
nav {
  background: linear-gradient(120deg, var(--verde-oscuro) 0%, var(--verde-profundo) 100%);
  border-bottom: 3px solid var(--terracota);
  padding: 0 2rem;
  display: flex;
  align-items: center;
  gap: .3rem;
  height: 68px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 16px var(--sombra);
}
.brand {
  display: flex; align-items: center; gap: .6rem;
  font-size: 1.25rem; font-weight: 700; color: var(--crema);
  text-decoration: none; margin-right: 1.4rem;
  letter-spacing: 1.5px; text-transform: uppercase;
}
.brand img {
  height: 40px; width: 40px; object-fit: contain; border-radius: 50%;
  border: 1.5px solid var(--terracota-suave);
  background: rgba(14,27,19,.6);
  padding: 2px;
}
.brand span { color: var(--terracota-suave); }
nav a:not(.brand) {
  color: var(--blanco-calido); text-decoration: none;
  padding: .5rem 1.05rem; border-radius: 20px;
  font-size: .87rem; font-weight: 500; transition: all .25s;
  border: 1px solid transparent;
}
nav a:not(.brand):hover, nav a.active {
  background: var(--terracota); color: var(--crema);
  font-weight: 700; border-color: var(--terracota);
}
.user-badge {
  display: flex; align-items: center; gap: .7rem;
  background: rgba(191,217,195,0.12);
  border: 1px solid rgba(191,217,195,0.4);
  border-radius: 20px; padding: .4rem 1rem; font-size: .85rem;
  color: var(--crema); margin-left: auto; font-weight: 600;
}
.user-badge i { color: var(--terracota-suave); font-size: 1rem; }
.role-badge { display: inline-block; padding: .2rem .7rem; border-radius: 12px; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.role-badge.admin { background: rgba(193,101,47,.35); color: var(--terracota-suave); border: 1px solid var(--terracota-suave); }
.role-badge.cajero { background: rgba(191,217,195,.2); color: var(--verde-claro); border: 1px solid var(--verde-claro); }
.btn-logout {
  background: transparent; border: 1px solid rgba(237,229,225,.4);
  color: var(--blanco-calido); padding: .45rem 1.1rem; border-radius: 20px;
  font-size: .85rem; font-weight: 600; text-decoration: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: .4rem; transition: all .25s;
}
.btn-logout:hover { background: rgba(237,229,225,.15); border-color: var(--blanco-calido); transform: translateY(-1px); }

/* HERO */
.hero {
  position: relative; overflow: hidden;
  background: linear-gradient(150deg, var(--verde-oscuro) 0%, #182720 55%, var(--verde-profundo) 100%);
  padding: 2.2rem 2rem 1.6rem;
}
.hero::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 85% 0%, rgba(193,101,47,.18), transparent 55%); pointer-events: none; }
.bg-steam { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.steam { position: absolute; bottom: -40px; border-radius: 50%; background: rgba(191,217,195,.06); filter: blur(16px); animation: subirVapor 11s ease-in-out infinite; }
.steam.s1 { left: 12%; width: 140px; height: 240px; animation-delay: 0s; animation-duration: 12s; }
.steam.s2 { left: 45%; width: 170px; height: 280px; animation-delay: 3s; animation-duration: 15s; }
.steam.s3 { left: 78%; width: 120px; height: 210px; animation-delay: 6s; animation-duration: 10s; }
.particula { position: absolute; border-radius: 50%; background: var(--terracota-suave); opacity: .6; animation: flotar 6s ease-in-out infinite; pointer-events: none; }
.p1 { width: 8px; height: 8px; top: 24px; right: 60px; }
.p2 { width: 5px; height: 5px; top: 60px; right: 120px; animation-delay: 1.4s; }
.p3 { width: 6px; height: 6px; bottom: 20px; right: 40px; animation-delay: 2.8s; }
.hero-inner {
  position: relative; z-index: 1; max-width: 700px; margin: 0 auto;
  display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
  animation: aparecer .6s ease;
}
.hero-inner h1 { font-size: 1.9rem; color: var(--crema); font-weight: 700; }
.hero-inner small { color: var(--terracota-suave); font-weight: 700; font-size: .8rem; letter-spacing: .04em; }

.container { max-width: 700px; margin: 0 auto; padding: 2.2rem 1.5rem 2.5rem; flex: 1; width: 100%; }

.form-card {
  background: white;
  border: 1px solid rgba(0,0,0,.05);
  border-radius: 18px;
  padding: 2.2rem;
  box-shadow: 0 10px 30px rgba(0,0,0,.1);
  animation: aparecer .5s ease .1s backwards;
  margin-top: -1rem;
  position: relative; z-index: 2;
}
.fg { margin-bottom: 1.3rem; }
.fg label { display: block; margin-bottom: .4rem; color: var(--marron); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.fg input, .fg select {
  width: 100%; padding: .8rem 1rem; background: var(--crema);
  border: 1.5px solid var(--crema-calida); border-radius: 10px;
  color: var(--cafe-oscuro); font-size: .95rem; outline: none; transition: all .25s;
}
.fg input:focus, .fg select:focus { border-color: var(--terracota-suave); box-shadow: 0 0 0 3px rgba(193,101,47,.15); background: white; }
.fg small { color: var(--marron); font-size: .76rem; margin-top: .4rem; display: block; opacity: .85; }
.row { display: flex; gap: 1rem; margin-top: 1.6rem; }

/* BOTONES */
.btn {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .65rem 1.3rem; border-radius: 20px;
  font-size: .85rem; font-weight: 700; border: none; cursor: pointer;
  text-decoration: none; position: relative; overflow: hidden;
  transition: all .3s cubic-bezier(.22,1,.36,1);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--sombra); }
.btn-green { background: var(--verde-claro); color: var(--verde-oscuro); border: 1px solid var(--verde-claro); font-weight: 800; }
.btn-red { background: var(--marron); color: white; border: 1px solid var(--marron); }
.btn-gold { background: linear-gradient(135deg, var(--terracota), var(--terracota-suave)); color: white; border: none; }
.btn-gold:hover { filter: brightness(1.08); }
.btn-sm { padding: .45rem 1rem; font-size: .78rem; }
.ripple { position: absolute; background: rgba(255,255,255,.5); border-radius: 50%; transform: scale(0); animation: rippleEffect .6s linear; pointer-events: none; }

.alert { display: flex; align-items: center; gap: .6rem; padding: .9rem 1.2rem; border-radius: 12px; margin-bottom: 1.4rem; font-size: .9rem; border-left: 4px solid; }
.alert-ok { background: rgba(191,217,195,.25); border-color: var(--verde-claro); color: #2a6040; }
.alert-error { background: rgba(78,52,46,.1); border-color: var(--marron); color: var(--marron); }

/* FOOTER */
.foot-v2 { background: var(--cafe-oscuro); border-top: 1px solid var(--linea-footer); padding: 1.6rem 2rem; display: flex; align-items: center; justify-content: center; gap: .9rem; }
.foot-logo { height: 34px; width: 34px; object-fit: contain; border-radius: 50%; opacity: .9; }
.foot-text { display: flex; flex-direction: column; text-align: left; }
.foot-text strong { color: var(--crema); font-family: 'Playfair Display', serif; font-size: .95rem; letter-spacing: .5px; }
.foot-text span { color: rgba(245,241,233,.55); font-size: .75rem; margin-top: .1rem; }

@media (max-width: 768px) {
  nav { padding: 0 1rem; gap: .3rem; height: auto; flex-wrap: wrap; padding-block: .6rem; }
  .hero { padding: 2rem 1rem 3rem; }
  .form-card { margin-top: -1.6rem; padding: 1.6rem; }
}
  </style>
</head>
<body>
<nav>
  <a href="/" class="brand"><img th:src="@{/img/LOGO2.png}" src="/img/LOGO2.png" alt="Logo Bruma"><span>BRUMA</span></a>
  <a th:href="@{/}">Dashboard</a>
  <a th:href="@{/clientes}" sec:authorize="hasRole('ADMIN')" class="active">Clientes</a>
  <a th:href="@{/productos}">Productos</a>
  <a th:href="@{/pedidos}">Pedidos</a>
  <a th:href="@{/reportes}" sec:authorize="hasRole('ADMIN')">Reportes</a>
  <a th:href="@{/respaldos}" sec:authorize="hasRole('ADMIN')">Respaldos</a>
  <a th:href="@{/usuarios/nuevo}" sec:authorize="hasRole('ADMIN')">Usuarios</a>
  <div class="user-badge">
    <i class="ti ti-user-circle"></i>
    <span sec:authentication="name">Usuario</span>
    <span sec:authorize="hasRole('ADMIN')" class="role-badge admin">Admin</span>
    <span sec:authorize="hasRole('CAJERO')" class="role-badge cajero">Cajero</span>
    <span sec:authorize="hasRole('MESERO')" class="role-badge mesero">Mesero</span>
  </div>
  <form th:action="@{/logout}" method="post" style="display:inline">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" class="btn-logout"><i class="ti ti-logout"></i> Salir</button>
  </form>
</nav>

<div class="hero">
  <div class="bg-steam"><div class="steam s1"></div><div class="steam s2"></div><div class="steam s3"></div></div>
  <div class="particula p1"></div><div class="particula p2"></div><div class="particula p3"></div>
  <div class="hero-inner">
    <div>
      <h1 th:text="${clienteForm.idCliente == null} ? 'Nuevo Cliente' : 'Editar Cliente'">Cliente</h1>
      <small>BRUMA Cafetería — Ficha de cliente</small>
    </div>
    <a th:href="@{/clientes}" class="btn btn-gold btn-sm">← Volver</a>
  </div>
</div>

<div class="container">
  <div th:if="${ok}"    class="alert alert-ok"    th:text="${ok}"></div>
  <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

  <div class="form-card">
    <!-- FIX 2: campos correctos según entidad Cliente (nombre + dni) -->
    <form th:action="@{/clientes/guardar}" method="post" th:object="${clienteForm}">
      <input type="hidden" th:field="*{idCliente}"/>
      <input type="hidden" th:field="*{fechaRegistro}"/>

      <div class="fg">
        <label>Nombre completo *</label>
        <input type="text" th:field="*{nombre}" required placeholder="Ej: María López"/>
      </div>
      <div class="fg">
        <label>DNI / Documento</label>
        <input type="text" th:field="*{dni}" placeholder="Ej: 12345678" maxlength="20"/>
        <small>Identificador único del cliente en el programa de fidelización.</small>
      </div>

      <div class="row">
        <button type="submit" class="btn btn-green">Guardar</button>
        <a th:href="@{/clientes}" class="btn btn-red">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<footer class="foot-v2">
  <img th:src="@{/img/LOGO2.png}" src="/img/LOGO2.png" alt="Logo Bruma" class="foot-logo">
  <div class="foot-text">
    <strong>BRUMA Cafetería</strong>
    <span>Sistema de Gestión Dual DB · © 2025</span>
  </div>
</footer>

<script>
  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', function (e) {
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const rect = this.getBoundingClientRect();
      ripple.style.left = (e.clientX - rect.left) + 'px';
      ripple.style.top  = (e.clientY - rect.top) + 'px';
      ripple.style.width = ripple.style.height = Math.max(rect.width, rect.height) + 'px';
      this.appendChild(ripple);
      setTimeout(() => ripple.remove(), 650);
    });
  });
</script>
</body>
</html>
