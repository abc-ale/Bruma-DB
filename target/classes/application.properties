# ── BRUMA Cafetería ─ application.properties ──────────────────
# Propiedades de configuración del sistema
# ──────────────────────────────────────────────────────────────

spring.application.name=bruma-cafeteria

# ── PostgreSQL (Supabase) ──────────────────────────────────────
# Se usa el Connection Pooler de Supabase (puerto 6543) en lugar
# del puerto directo 5432, que suele estar bloqueado en redes
# universitarias y corporativas.
# Usuario del pooler: postgres.<project-ref>
spring.datasource.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.nottochfbpahefxymeqq
spring.datasource.password=Ch61087899-ale
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — ajustes para conexión via pooler
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── MongoDB (Atlas) ────────────────────────────────────────────
spring.data.mongodb.uri=mongodb+srv://u24200021_db_ale:Plantita10+@bruma.zloypsz.mongodb.net/?appName=Bruma
spring.data.mongodb.database=bruma_db

# ── Thymeleaf ──────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ── Servidor ───────────────────────────────────────────────────
server.port=8081

# ── Spring Security ────────────────────────────────────────────
# Usuarios creados automáticamente al iniciar (DataInitializer):
#   admin  / admin123  -> ROLE_ADMIN  (acceso total + reportes)
#   cajero / cajero123 -> ROLE_CAJERO (sin eliminar ni reportes)

# ── Respaldos periódicos ───────────────────────────────────────
# Directorio donde se guardan los archivos de respaldo
bruma.backup.directorio=backups
