# ── BRUMA Cafetería — MODO DEMO ────────────────────────────────
# Ejecuta la aplicación SIN conexión a base de datos externa.
# Usa H2 en memoria (PostgreSQL) y deshabilita MongoDB por completo.
# ───────────────────────────────────────────────────────────────

spring.application.name=bruma-cafeteria-demo

# ── H2 en memoria (reemplaza PostgreSQL) ───────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console — http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ── MongoDB DESHABILITADO ───────────────────────────────────────
# Se excluye el auto-configurador de Mongo para evitar intentos de conexión
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# ── Thymeleaf ──────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ── Servidor ───────────────────────────────────────────────────
server.port=8080

# ── Spring Security ────────────────────────────────────────────
# Usuarios creados automáticamente por DataInitializer:
#   admin  / admin123  → ROLE_ADMIN
#   cajero / cajero123 → ROLE_CAJERO

# ── Logging ────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.bruma=INFO
logging.level.org.springframework.security=WARN
